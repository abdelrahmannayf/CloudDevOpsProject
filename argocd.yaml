apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finalproject
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/abdelrahmannayf/CloudDevOpsProject.git
    targetRevision: HEAD
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: finalpro

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
